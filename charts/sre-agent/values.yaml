# ============================================================================
# Randoli SRE Agent — configuration values
#
# Install modes:
#   * As a dependency of the randoli-agent (data plane) umbrella chart: the
#     defaults in `observability:` and `dataPlane:` already point at the
#     umbrella's service names, so only `analysis.enabledNamespaces` must be set.
#   * Standalone: override EVERY value in `observability:` and `dataPlane:` to
#     point at your own Prometheus / Loki / Tempo / OTel collector / Flight
#     SQL / callback endpoints, and create the required secrets (see readme).
#
# Model pricing is NOT a value here: it ships as templates/models-configmap.yaml and is mounted at
# /etc/agentic-ai/models.yaml. Every id in `models:` below must have an entry there, or that call is
# rejected as an unsupported model.
# ============================================================================

image:
  # -- Image repository of the SRE agent. This is the PUBLIC repo the webhook-driven pipeline
  # publishes to; the old private randoli/ai-agent is no longer built.
  repository: docker.io/randoli/sre-agent
  # -- Image tag. Defaults to the chart's appVersion when empty; set this to
  # run a different agent version (takes precedence over appVersion).
  tag: ""

# -- Extra annotations added to the agent pod template (e.g. service-mesh
# sidecar hints). Merged with the chart's own checksum annotation.
annotations: {}

# -- Verbose debug logging for the agent pod ('True' or 'False').
debug: 'False'

# ----------------------------------------------------------------------------
# analysis — investigation scope, LLM budget, and reasoning limits
# ----------------------------------------------------------------------------
analysis:
  # -- Namespaces the agent may analyze, as a comma-separated list.
  # REQUIRED: replace the placeholder. Escape commas as `\,` with --set.
  enabledNamespaces: 'namespace1,namespace2'

  # -- Workloads to restrict analysis to (comma-separated).
  # Empty means all workloads in the enabled namespaces.
  enabledWorkloads: ''

  # -- Daily budget cap for LLM (Bedrock) calls, in USD. Analysis pauses for
  # the rest of the day once the cap is reached.
  dailyBudgetUsd: '20'

  # -- Maximum reasoning iterations of the MCP tool-calling loop per query.
  maxIterationsMCP: '25'

  # -- Maximum reasoning iterations of the root-cause-analysis investigator.
  maxIterationsRCA: '25'

  # -- Maximum reasoning iterations of the runbook executor. Higher than RCA because a runbook
  # both investigates AND acts.
  maxIterationsRunbook: '35'

  # -- How often (seconds) to reconcile the local spend total against the database. The budget
  # check itself is local, so this only folds in what OTHER replicas have spent.
  budgetReconcileEverySeconds: '60'

  # -- Seconds to wait for that reconcile read before giving up. Failing to read fails CLOSED
  # (LLM calls are suppressed), so keep this well under any client timeout.
  budgetReadTimeoutSeconds: '5'

# ----------------------------------------------------------------------------
# sreChat — limits for the interactive chat agent. It is a hybrid (quick lookups,
# bounded actions, and deep dives), so its caps sit between RCA and runbook.
# ----------------------------------------------------------------------------
sreChat:
  # -- Max tool-loop iterations per turn.
  maxIterations: '30'
  # -- Max parallel tool calls the agent may request in one iteration.
  maxToolsPerStep: '5'
  # -- How many times it may ask the user a clarifying question before it must answer regardless.
  maxClarificationRounds: '3'
  # -- Cross-conversation memory: how many past (query, summary) pairs to load at intake.
  historyCount: '10'

# ----------------------------------------------------------------------------
# llm — LLM backend configuration (AWS Bedrock)
# ----------------------------------------------------------------------------
llm:
  # -- LLM provider. Currently only 'aws' (AWS Bedrock) is supported.
  provider: aws

  # -- AWS region used for Bedrock calls.
  region: us-east-1

  # -- Name of a pre-existing secret holding the AWS credentials
  # (keys: AWS_ACCESS_KEY_ID, AWS_REGION, AWS_SECRET_ACCESS_KEY).
  # This secret is NOT created by the chart — see the readme.
  credentialsSecretName: randoli-sre-agent-secret

# ----------------------------------------------------------------------------
# observability — telemetry backends the agent queries and exports to.
# Defaults match the service names installed by the randoli-agent data plane
# chart. Standalone installs MUST override every value in this section.
# ----------------------------------------------------------------------------
observability:
  # -- Base URL of the Prometheus server used for metrics queries.
  prometheusUrl: http://randoli-obs-prometheus:80

  # -- Base URL of the Loki gateway used for log queries.
  lokiUrl: http://randoli-obs-loki:3100

  # -- Base URL of the Tempo query endpoint used for trace queries.
  tempoUrl: http://randoli-obs-tempo:3200

  # -- OTLP gRPC endpoint of the OpenTelemetry collector the agent exports its
  # own telemetry to.
  otelExporterEndpoint: http://randoli-otel-collector:4317

  # -- OTLP HTTP endpoint of the OpenTelemetry collector (Traceloop base URL).
  traceLoopBaseUrl: http://randoli-otel-collector:4318

  # -- Set 'true' to stop the agent exporting its own traces and metrics. Only affects the agent's
  # self-telemetry; it still QUERIES Prometheus / Loki / Tempo for investigations either way.
  otelDisabled: 'false'

# ----------------------------------------------------------------------------
# dataPlane — Randoli data plane services the agent reports back to.
# Defaults match the randoli-agent umbrella chart's service names.
# Standalone installs MUST override every value in this section.
# ----------------------------------------------------------------------------
dataPlane:
  # -- Callback URL of the randoli-agent service (control + result reporting).
  agentCallbackUrl: http://randoli-agent:8080/

  # -- Callback URL for scheduled (periodic) runbook results. Same receiver as agentCallbackUrl by
  # default; point it elsewhere only if periodic runs should report somewhere different.
  periodicRunbookCallbackUrl: http://randoli-agent:8080/

  # -- Arrow Flight SQL endpoint of the data plane's analytics store.
  flightSqlUrl: grpc+tcp://randoli-agent:31337

  # -- Name of a pre-existing secret holding the Flight SQL credentials
  # (keys: username, password). Created by the data plane chart, NOT by this
  # chart.
  databaseSecretName: randoli-agent-db

# ----------------------------------------------------------------------------
# Scheduling. Top-level keys and their `global.` counterparts are merged (both
# applied), so an umbrella chart can set them fleet-wide via `global.*`.
# ----------------------------------------------------------------------------

# -- nodeSelector constraints for the agent pod.
nodeSelector:

# -- Affinity rules for the agent pod.
affinity:

# -- Tolerations for the agent pod.
tolerations:

global:
  # -- Umbrella-chart-wide nodeSelector, merged with the top-level key.
  nodeSelector:
  # -- Umbrella-chart-wide affinity, merged with the top-level key.
  affinity:
  # -- Umbrella-chart-wide tolerations, merged with the top-level key.
  tolerations:


models:
  # Root cause analysis
  RCA_COMPACTION_MODEL: qwen.qwen3-coder-30b-a3b-v1:0
  RCA_INVESTIGATOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  RCA_ITERATION_FINDING_MODEL: qwen.qwen3-coder-30b-a3b-v1:0
  RCA_POST_PROCESSOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  RCA_TOOL_OUTPUT_SUMMARIZER_MODEL: qwen.qwen3-coder-30b-a3b-v1:0
  RCA_VERDICT_EXTRACTOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0

  # Runbook execution
  RUNBOOK_ATLASSIAN_EXTRACTOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  RUNBOOK_COMPACTION_MODEL: qwen.qwen3-coder-30b-a3b-v1:0
  RUNBOOK_EXECUTOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  RUNBOOK_GITHUB_EXTRACTOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  RUNBOOK_ITERATION_FINDING_MODEL: qwen.qwen3-coder-30b-a3b-v1:0
  RUNBOOK_POST_PROCESSOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  RUNBOOK_TOOL_OUTPUT_SUMMARIZER_MODEL: qwen.qwen3-coder-30b-a3b-v1:0
  RUNBOOK_VERDICT_EXTRACTOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0

  # Periodic (scheduled) runbook
  PERIODIC_RUNBOOK_COMPACTION_MODEL: qwen.qwen3-coder-30b-a3b-v1:0
  PERIODIC_RUNBOOK_EXECUTOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  PERIODIC_RUNBOOK_GITHUB_EXTRACTOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  PERIODIC_RUNBOOK_ITERATION_FINDING_MODEL: qwen.qwen3-coder-30b-a3b-v1:0
  PERIODIC_RUNBOOK_POST_PROCESSOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  PERIODIC_RUNBOOK_TICKETING_EXTRACTOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  PERIODIC_RUNBOOK_TOOL_OUTPUT_SUMMARIZER_MODEL: qwen.qwen3-coder-30b-a3b-v1:0
  PERIODIC_RUNBOOK_VERDICT_EXTRACTOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0

  # Interactive SRE chat
  SRE_CHAT_ANALYSIS_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  SRE_CHAT_ATLASSIAN_EXTRACTOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  SRE_CHAT_COMPACTION_MODEL: qwen.qwen3-coder-30b-a3b-v1:0
  SRE_CHAT_CONVERSATION_SUMMARIZER_MODEL: qwen.qwen3-coder-30b-a3b-v1:0
  SRE_CHAT_EXECUTOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  SRE_CHAT_GITHUB_EXTRACTOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  SRE_CHAT_ITERATION_FINDING_MODEL: qwen.qwen3-coder-30b-a3b-v1:0
  SRE_CHAT_POST_PROCESSOR_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  SRE_CHAT_RESOLVER_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  SRE_CHAT_TOOL_OUTPUT_SUMMARIZER_MODEL: qwen.qwen3-coder-30b-a3b-v1:0
