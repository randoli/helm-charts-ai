# ============================================================================
# Randoli SRE Agent: configuration values
#
# Install modes:
#   * As a dependency of the randoli-agent (data plane) umbrella chart: the
#     defaults in `observability:` and `dataPlane:` already point at the
#     umbrella's service names, so only `analysis.enabledNamespaces` must be set.
#   * Standalone: override EVERY value in `observability:` and `dataPlane:` to
#     point at your own Prometheus / Loki / Tempo / OTel collector /
#     PostgreSQL / callback endpoints, and create the required secrets (see readme).
#
# Model pricing is NOT a value here: it ships as templates/models-configmap.yaml and is mounted at
# /etc/agentic-ai/models.yaml. Every model the llm profile maps to has an entry there; a model without
# one is rejected as unsupported.
# ============================================================================

image:
  # -- Image repository of the SRE agent. This is the PUBLIC repo the webhook-driven pipeline
  # publishes to; the old private randoli/ai-agent is no longer built.
  repository: docker.io/randoli/sre-agent
  # -- Image tag. Defaults to the chart's appVersion when empty; set this to
  # run a different agent version (takes precedence over appVersion).
  tag: ""

# -- Extra annotations added to the agent pod template (e.g. service-mesh
# sidecar hints). Merged with the chart's own checksum annotation.
annotations: {}

# python levels (DEBUG / INFO / WARNING / ERROR).
logLevel: 'INFO'

# ----------------------------------------------------------------------------
# analysis: investigation scope, LLM budget, and reasoning limits
# ----------------------------------------------------------------------------
analysis:
  credentialKeyPattern: '(?i)(password|passwd|token|secret|apikey|api_key|private_key|privatekey|credential|connection_?string)'

  # -- Namespaces the agent may analyze, as a comma-separated list.
  # REQUIRED: replace the placeholder. Escape commas as `\,` with --set.
  enabledNamespaces: 'namespace1,namespace2'

  # -- Workloads to restrict analysis to (comma-separated).
  # Empty means all workloads in the enabled namespaces.
  enabledWorkloads: ''

  # -- Daily budget cap for LLM (Bedrock) calls, in USD. Analysis pauses for
  # the rest of the day once the cap is reached.
  dailyBudgetUsd: '20'

  # -- Maximum reasoning iterations of the MCP tool-calling loop per query.
  maxIterationsMCP: '25'

  # -- Maximum reasoning iterations of the root-cause-analysis investigator.
  maxIterationsRCA: '25'

  # -- Lowest RCA confidence (1 to 9) that still gets immediate and long-term fixes. Below it the
  # report carries only the gaps, because a fix built on a weak chain sends people to change the
  # wrong thing. Applies to every outcome.
  minConfidenceForFixesRCA: '8'

  # -- Maximum reasoning iterations of the runbook executor. Higher than RCA because a runbook
  # both investigates AND acts.
  maxIterationsRunbook: '35'
  maxIterationsRunbookValidation: '11'
  maxIterationsPeriodicRunbook: '15'

  # -- Share of the model's context window, in percent, at which the older part of an agent's history
  # is compacted into one summary before the next call. The window of each model comes from the models
  # ConfigMap.
  compactionTriggerPct: '95'

  # -- Share of the context window, in percent, that the newest replies and their tool results may take
  # and still be kept word for word through a compaction. Older results are saved to files the agent
  # can read back.
  compactionKeepRecentPct: '25'

  # -- What one LLM call claims against the daily budget before it runs, in USD. The claim is
  # rewritten to the real cost once the call returns. Raising it refuses calls sooner near the
  # cap; lowering it lets a burst overshoot by more.
  budgetCallEstimateUsd: '0.3'

  # -- How many tool calls run at once per iteration. Bounds concurrency only; how many calls one
  # reply may make at all is maxToolCallsPerIteration.
  toolConcurrency: '8'
  # -- The most tool calls one loop reply runs, bash reads and task list updates included. Calls past
  # it get a not-run result asking for them in the next reply; the prompt states the number. '0' removes the limit.
  maxToolCallsPerIteration: '5'
  toolTransientRetries: '2'
  # -- One tool result an agent reads whole is at most this share of the model's window, in percent,
  # and at most toolResultMaxTokens. A larger result is saved to a file in the pod, and the agent
  # reads a preview and then the parts it needs with its restricted bash tool.
  toolResultMaxWindowPct: '15'
  toolResultMaxTokens: '25000'
  # -- Hours a chat's saved tool results are kept; a single run's are deleted when it ends.
  toolResultRetentionHours: '24'
  # -- Size limit of the emptyDir that holds saved tool results. The kubelet evicts the pod when the
  # folder grows past it, so keep it well above normal use; folders are deleted when a run ends, with
  # a chat, or after toolResultRetentionHours.
  toolResultStorageSizeLimit: '2Gi'
  # -- Byte budget the agent keeps the saved tool results under, deleting the oldest folders no run is
  # using once it is passed. Keep it below toolResultStorageSizeLimit so the kubelet never evicts the pod.
  toolResultStorageMaxBytes: '1610612736'
  # -- Memory, in MB, each program of the agent's bash tool may use (sort, jq and the rest). A jq on the
  # largest saved result needs about 128. Several can run at once inside the agent's 1Gi limit, so raise
  # that limit before raising this. 0 turns the cap off.
  bashToolMemoryLimitMb: '256'
  kubernetesOperationTimeoutSeconds: '30'
  budgetReserveWaitSeconds: '180'
  budgetReserveWaitChatSeconds: '15'
  budgetReprobeSeconds: '60'
  budgetSweepIntervalSeconds: '600'

# ----------------------------------------------------------------------------
# sreChat: limits for the interactive chat agent. It is a hybrid (quick lookups,
# bounded actions, and deep dives), so its caps sit between RCA and runbook.
# ----------------------------------------------------------------------------
sreChat:
  # -- Max tool-loop iterations per turn.
  maxIterations: '30'
  # -- How many times it may ask the user a clarifying question before it must answer regardless.
  maxClarificationRounds: '3'
  # -- Cross-conversation memory: how many past (query, summary) pairs to load at intake.
  historyCount: '30'
  # -- How many past finished chats about the SAME incident to load at intake.
  incidentHistoryCount: '5'
  # -- A question about an incident reads from this many hours before the incident's occurredAt...
  incidentWindowBeforeHours: '3'
  # -- ...to this many hours after it, or now if sooner.
  incidentWindowAfterHours: '1'
  titleMaxChars: '1000'
  titleTimeoutSeconds: '20'
  maxRunningTurns: '30'
  maxWaitingTurns: '64'
  waitTimeoutSeconds: '30'

# ----------------------------------------------------------------------------
# llm: LLM backend configuration (AWS Bedrock)
# ----------------------------------------------------------------------------
llm:
  # -- LLM provider: aws, anthropic, openai, azure_openai, vertex, azure_anthropic,
  # azure_meta, azure_mistral or azure_deepseek. See the readme for what each one reads.
  provider: aws

  # -- Model family on that provider. Empty uses the provider's default. Change it with llm.provider:
  # a family the provider does not offer stops the agent at start. The models each family maps
  # to are in docs/model_profiles.md:
  # aws: claude (default), nova, mistral, deepseek, qwen, gpt-oss; anthropic: claude;
  # vertex: claude (default), gemini; openai and azure_openai: gpt; azure_deepseek: deepseek.
  # azure_anthropic, azure_meta and azure_mistral have no families: set this and llm.preset to ''.
  family: claude

  # -- balanced: a strong model on the agent loops and the family's lighter model on compaction
  # summaries and chat titles (claude: Sonnet 4.5 and Haiku 4.5). quality: the family's strongest model
  # on every role (claude: Sonnet 5.5). Empty means balanced. The versions are chosen in the agent.
  preset: balanced

  # -- How hard the agent loops think before each reply: off, low, medium or high. Applied only when
  # the loop model can think (Claude 4.5); otherwise thinking stays off and the agent says so in one
  # startup line.
  effort: 'off'

  # -- Name of a pre-existing secret holding a Google service account key file under the key
  # key.json, for llm.provider vertex. Mounted at /var/secrets/google/key.json and pointed to by
  # GOOGLE_APPLICATION_CREDENTIALS. Leave empty when the pod gets Google credentials another way.
  googleCredentialsSecretName: ''

  # -- AWS region used for Bedrock calls.
  region: us-east-1

  # -- Seconds one LLM call may take before it is retried.
  callTimeoutSeconds: '120'

  # -- How many times a timed-out LLM call is retried before the run stops.
  callRetries: '2'

  firstTokenRetries: '1'

  readTimeoutSeconds: '240'

  sideReadTimeoutSeconds: '60'

  connectTimeoutSeconds: '10'

  keepWarmSeconds: '240'

  streaming: 'true'

  # -- Prompt cache lifetime. '1h' keeps the cached prefix warm across a whole investigation;
  # empty uses the provider's 5-minute default. '1h' costs more to write and far less to re-read.
  promptCacheTtl: '1h'

  # -- Temperature of every model call that does not think. Set it to 'none' or '' to send no
  # temperature, for a model that rejects one. A model that thinks is always sent none.
  temperature: '0.00000001'

  # -- Name of a pre-existing secret holding the AWS credentials
  # (keys: AWS_ACCESS_KEY_ID, AWS_REGION, AWS_SECRET_ACCESS_KEY).
  # This secret is NOT created by the chart; see the readme.
  credentialsSecretName: randoli-sre-agent-secret

# ----------------------------------------------------------------------------
# observability: telemetry backends the agent queries and exports to.
# Defaults match the service names installed by the randoli-agent data plane
# chart. Standalone installs MUST override every value in this section.
# ----------------------------------------------------------------------------
observability:
  # -- Base URL of the Prometheus server used for metrics queries.
  prometheusUrl: http://randoli-obs-prometheus:80

  # -- Base URL of the Loki gateway used for log queries.
  lokiUrl: http://randoli-obs-loki:3100

  # -- Base URL of the Tempo query endpoint used for trace queries.
  tempoUrl: http://randoli-obs-tempo:3200

  # -- OTLP gRPC endpoint of the OpenTelemetry collector the agent exports its
  # own telemetry to.
  otelExporterEndpoint: http://randoli-otel-collector:4317

  # -- OTLP HTTP endpoint of the OpenTelemetry collector (Traceloop base URL).
  traceLoopBaseUrl: http://randoli-otel-collector:4318

  # -- Set 'true' to stop the agent exporting its own traces and metrics. Only affects the agent's
  # self-telemetry; it still QUERIES Prometheus / Loki / Tempo for investigations either way.
  otelDisabled: 'false'
  lokiTimeoutSeconds: '100'
  tempoTimeoutSeconds: '30'

# ----------------------------------------------------------------------------
# dataPlane: Randoli data plane services the agent reports back to.
# Defaults match the randoli-agent umbrella chart's service names.
# Standalone installs MUST override every value in this section.
# ----------------------------------------------------------------------------
dataPlane:
  agentCallbackUrl: http://randoli-agent:8080/

  # -- PostgreSQL server of the data plane (the umbrella chart's randoli-db).
  # Values are rendered through `tpl`.
  dbHost: randoli-db
  dbPort: '5432'
  dbName: randoli
  # -- libpq sslmode: disable, require, verify-ca, verify-full
  dbSslMode: disable
  # -- Database role of the SRE agent (read access to the data plane tables,
  # write access to its audit and chat tables).
  dbUser: sre_agent

  # -- Base URL of the OpenCost service the agent queries for cost data.
  opencostUrl: http://opencost.randoli-agents.svc.cluster.local:8081

  # -- Name of a pre-existing secret holding the database password (rendered
  # through `tpl`). Created by the data plane chart, NOT by this chart.
  databaseSecretName: randoli-agent-db
  # -- Key of the SRE agent's password in databaseSecretName.
  databasePasswordKey: sre-agent-password

  # -- Seconds any single database statement may take. The per-call budget reservation runs
  # on this path and fails CLOSED, so a slow store suppresses LLM calls rather than hanging.
  dbTimeoutSeconds: '10'
  dbPoolMaxConnections: '4'
  dbPoolAcquireTimeoutSeconds: '30'
  dbPoolIdleTimeoutSeconds: '60'
  dbPoolMaxIdle: '1'
  dbPoolReapIntervalSeconds: '15'
  healthDbCheckTtlSeconds: '5'

server:
  backlog: '4096'
  limitConcurrency: '0'
  timeoutKeepAliveSeconds: '5'
  timeoutGracefulShutdownSeconds: '30'
  outboundHttpTimeoutSeconds: '30'
  rateLimit:
    enabled: 'true'
    endpointBurst: '2000'
    endpointPerSecond: '200'
    clientBurst: '1000'
    clientPerSecond: '100'
    maxClients: '10000'
  workers:
    db: '4'
    blocking: '8'
    tool: '64'
    llm: '64'

mcpClient:
  sessionsPerServer: '4'
  callsPerSession: '16'
  acquireTimeoutSeconds: '4'
  connectTimeoutSeconds: '4'
  openTimeoutSeconds: '15'
  callTimeoutSeconds: '30'
  maxAttempts: '2'
  retryBackoffSeconds: '0.5'
  openFailureBackoffSeconds: '2'
  sessionMaxAgeSeconds: '600'
  sessionIdleSeconds: '300'
  defaultMaxCalls: '10'

# ----------------------------------------------------------------------------
# mcpServers: MCP servers wired into the agent. Each server installs its
# in-cluster Deployment/Service (where needed) plus the MCPConfiguration CR
# that registers it with the agent (the agent watches the CRD in crds/).
# All servers install by default; turn any off with its `enabled` flag.
#
# ----------------------------------------------------------------------------
mcpServers:
  # Kubernetes MCP server (Deployment + Service + RBAC + CR).
  # Automatically disabled on OpenShift (global.openshift.enabled=true).
  kubernetes:
    enabled: true
    # -- Image as registry/repo:tag (optionally repo@sha256:digest).
    image: ghcr.io/containers/kubernetes-mcp-server:v0.0.66
    imagePullPolicy: IfNotPresent
    port: 8080
    # -- Toolsets exposed by the server (see containers/kubernetes-mcp-server docs).
    toolsets: "config,core,helm,kcp,kiali,kubevirt,tekton"
    resources:
      requests:
        cpu: 50m
        memory: 258Mi
      limits:
        memory: 1Gi
    # Scheduling: merged with the global.* counterparts (both applied).
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # -- Extra labels/annotations merged over the standard set (global.* applied first).
    labels: {}
    annotations: {}
    podAnnotations: {}

  # Loki MCP server (Deployment + Service + CR; Randoli-repackaged
  # grafana/loki-mcp, read-only). Talks to Loki directly over its HTTP API
  # and serves streamable HTTP on /stream.
  loki:
    enabled: true
    image: docker.io/randoli/loki-mcp:v0.6.0
    imagePullPolicy: IfNotPresent
    # -- Port the server listens on (rendered as PORT) and the Service port.
    port: 8000
    # -- Loki base URL (rendered as LOKI_URL). When empty, observability.lokiUrl is used.
    lokiUrl: 'http://randoli-obs-loki-dist-query-frontend.{{ .Release.Namespace }}.svc:3100'
    # -- Loki tenant (rendered as LOKI_ORG_ID). When empty, no tenant is sent.
    orgId: ""
    auth:
      # -- Name of a pre-created secret holding a Loki bearer token. When empty, no token env is rendered.
      secretName: ""
      # -- Key within secretName holding the token.
      tokenKey: LOKI_TOKEN
    # -- Extra container env vars / CLI args appended to the built-in set.
    extraEnv: []
    extraArgs: []
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    # Scheduling: merged with the global.* counterparts (both applied).
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # -- Extra labels/annotations merged over the standard set (global.* applied first).
    labels: {}
    annotations: {}
    podAnnotations: {}

  # Prometheus MCP server (Deployment + Service + CR; tjhop/prometheus-mcp-server,
  # read-only PromQL over streamable HTTP). Queries the Prometheus at
  # `observability.prometheusUrl`; installs only when that URL is set.
  prometheus:
    enabled: true
    image: ghcr.io/tjhop/prometheus-mcp-server:v0.18.0
    imagePullPolicy: IfNotPresent
    port: 8080
    # -- Extra container env vars / CLI args appended to the built-in set.
    extraEnv: []
    extraArgs: []
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    # Scheduling: merged with the global.* counterparts (both applied).
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # -- Extra labels/annotations merged over the standard set (global.* applied first).
    labels: {}
    annotations: {}
    podAnnotations: {}

  # Tempo MCP: no server Deployment; the CR points at the Tempo
  # query-frontend's built-in MCP endpoint (<observability.tempoUrl>/api/mcp).
  # The endpoint itself is enabled by the chart that installs Tempo (in the
  # randoli-agent umbrella: tempo/tempoDistributed mcp_server keys).
  tempo:
    enabled: true

  # OpenCost MCP: no server Deployment; the CR points at the OpenCost
  # service's built-in MCP endpoint (dataPlane.opencostUrl; OpenCost serves
  # streamable HTTP MCP at the port root, no path suffix).
  opencost:
    enabled: false

guardrails:
  enabled: true
  podDisruptionBudgets: true
  serviceAccounts:
    - name: mcp-server-openshift
  workloads:
    - name: randoli-agent
      kind: StatefulSet
      matchLabels:
        app.kubernetes.io/name: randoli-agent
        app.kubernetes.io/component: randoli-agent
    - name: randoli-db
      kind: StatefulSet
      matchLabels:
        app.kubernetes.io/name: randoli-agent
        app.kubernetes.io/component: randoli-db
    - name: randoli-sre-agent
      kind: Deployment
      matchLabels:
        app: randoli-sre-agent
    - name: randoli-tproxy
      kind: Deployment
      allowScale: true
      matchLabels:
        app.kubernetes.io/name: randoli-tproxy
        app.kubernetes.io/component: randoli-tproxy
    - name: randoli-mcp-server-kubernetes
      kind: Deployment
      matchLabels:
        app: randoli-mcp-server-kubernetes
    - name: randoli-mcp-server-loki
      kind: Deployment
      matchLabels:
        app: randoli-mcp-server-loki
    - name: randoli-mcp-server-prometheus
      kind: Deployment
      matchLabels:
        app: randoli-mcp-server-prometheus
    - name: mcp-server-openshift
      kind: Deployment
      matchLabels:
        app: mcp-server-openshift
    - name: mcp-server-github
      kind: Deployment
      matchLabels:
        app: mcp-server-github
    - name: mcp-server-atlassian
      kind: Deployment
      matchLabels:
        app: mcp-server-atlassian
    - name: mcp-server-argocd
      kind: Deployment
      matchLabels:
        app: mcp-server-argocd
    - name: mcp-server-strimzi
      kind: Deployment
      matchLabels:
        app: mcp-server-strimzi
    - name: mcp-server-kyverno
      kind: Deployment
      matchLabels:
        app: mcp-server-kyverno

# ----------------------------------------------------------------------------
# Scheduling. Top-level keys and their `global.` counterparts are merged (both
# applied), so an umbrella chart can set them fleet-wide via `global.*`.
# ----------------------------------------------------------------------------

# -- nodeSelector constraints for the agent pod.
nodeSelector:

# -- Affinity rules for the agent pod.
affinity:

# -- Tolerations for the agent pod.
tolerations:

global:
  # -- Umbrella-chart-wide nodeSelector, merged with the top-level key.
  nodeSelector:
  # -- Umbrella-chart-wide affinity, merged with the top-level key.
  affinity:
  # -- Umbrella-chart-wide tolerations, merged with the top-level key.
  tolerations:
  # -- Umbrella-chart-wide imagePullSecrets applied to the MCP server pods.
  imagePullSecrets: []
  # -- Umbrella-chart-wide extra labels/annotations, merged under the per-server ones.
  labels: {}
  annotations: {}
  # -- Set by the umbrella chart on OpenShift; disables the Kubernetes MCP server.
  openshift:
    enabled: false


# -- Per-loop thinking budget overrides: how many tokens that loop's model may think before each
# reply, between tool calls too. llm.effort sets every loop's budget at once; a key set here replaces
# the budget of that one loop only. Only Claude on aws, anthropic and vertex can think.
# Empty by default, so the budgets come from llm.effort, which is off.
# To override one loop, uncomment its line below (the value shown is the medium effort budget)
# and change `thinkingBudgets: {}` to `thinkingBudgets:`. A value above 0 must be at least 1024 and
# below the model's max_output_tokens (16000 for Sonnet 4.5).
# The agent reads these at startup, so restart it after a change.
thinkingBudgets: {}
  # RCA_INVESTIGATOR_THINKING_BUDGET: 6000
  # RUNBOOK_EXECUTOR_THINKING_BUDGET: 4000
  # PERIODIC_RUNBOOK_EXECUTOR_THINKING_BUDGET: 4000
  # RUNBOOK_VALIDATION_EXECUTOR_THINKING_BUDGET: 4000
  # SRE_CHAT_EXECUTOR_THINKING_BUDGET: 4000
  # MCP_TOOL_CALLING_THINKING_BUDGET: 2048
