apiVersion: apps/v1
kind: Deployment
metadata:
  name: randoli-sre-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "selectorLabels" . | nindent 4 }}
    {{- include "labels" . | nindent 4 }}
  annotations:
    resource.opentelemetry.io/service.name: randoli-sre-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "selectorLabels" . | nindent 8 }}
        {{- include "labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        resource.opentelemetry.io/service.name: randoli-sre-agent
        {{- if .Values.annotations }}
          {{- with .Values.annotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}        
    spec:
      serviceAccountName: randoli-sre-agent
      containers:
        - name: agent
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl $.Values.dataPlane.databaseSecretName $ }}
                  key: {{ $.Values.dataPlane.databasePasswordKey }}
            - name: ORGANIZATION_ID
              {{- if $.Values.recommendationService.orgId }}
              value: {{ $.Values.recommendationService.orgId | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ tpl $.Values.recommendationService.orgIdSecretName $ }}
                  key: {{ $.Values.recommendationService.orgIdSecretKey }}
              {{- end }}
            {{- if eq $.Values.llm.provider "aws" }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.llm.credentialsSecretName }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.llm.credentialsSecretName }}
                  key: AWS_SECRET_ACCESS_KEY
            {{- else if eq $.Values.llm.provider "anthropic" }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.llm.credentialsSecretName }}
                  key: ANTHROPIC_API_KEY
            {{- end }}
          envFrom:
            - configMapRef:
                name: randoli-sre-agent-config
          volumeMounts:
            - name: tool-results
              mountPath: /var/lib/sre-agent/tool_results
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 10m
              memory: 382Mi
      volumes:
        - name: tool-results
          emptyDir:
            sizeLimit: {{ .Values.analysis.toolResultStorageSizeLimit }}
      {{- if or .Values.tolerations .Values.global.tolerations }}
      tolerations:
        {{- with .Values.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.global.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }} 
      {{- end }}
      {{- if or .Values.nodeSelector .Values.global.nodeSelector }}
      nodeSelector:
        {{- with .Values.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.global.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }} 
      {{- end }}
      {{- if or .Values.affinity .Values.global.affinity }}
      affinity:
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.global.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }} 
      {{- end }}
