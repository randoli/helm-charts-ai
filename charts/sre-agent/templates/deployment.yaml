apiVersion: apps/v1
kind: Deployment
metadata:
  name: randoli-sre-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app: randoli-sre-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: randoli-sre-agent
  template:
    metadata:
      labels:
        app: randoli-sre-agent
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.annotations }}
          {{- with .Values.annotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}        
    spec:
      serviceAccountName: randoli-sre-agent
      containers:
        - name: agent
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: FLIGHTSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.dataPlane.databaseSecretName }}
                  key: password
            - name: FLIGHTSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.dataPlane.databaseSecretName }}
                  key: username
          envFrom:
            - configMapRef:
                name: randoli-sre-agent-config
            - secretRef:
                name: {{ $.Values.llm.credentialsSecretName }}
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 10m
              memory: 382Mi
      {{- if or .Values.tolerations .Values.global.tolerations }}
      tolerations:
        {{- with .Values.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.global.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }} 
      {{- end }}
      {{- if or .Values.nodeSelector .Values.global.nodeSelector }}
      nodeSelector:
        {{- with .Values.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.global.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }} 
      {{- end }}
      {{- if or .Values.affinity .Values.global.affinity }}
      affinity:
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.global.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }} 
      {{- end }}