{{- if and .Values.mcpServers.tempo.enabled .Values.observability.tempoUrl }}
apiVersion: mcp.ai.randoli.io/v1beta1
kind: MCPConfiguration
metadata:
  name: mcp-tempo
  annotations:
    mcp.ai.randoli.io/rca:                "enabled"
    mcp.ai.randoli.io/runbook:            "enabled"
    mcp.ai.randoli.io/periodic-runbook:   "enabled"
    mcp.ai.randoli.io/runbook-validation: "enabled"
    mcp.ai.randoli.io/sre-chat:           "enabled"
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.tempo.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "mcpServerLabels" (dict "context" . "component" "randoli-mcp-kubernetes-readonly") | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.tempo.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  namespace: {{ .Release.Namespace }}
spec:
  type: tempo
  transport: streamable_http
  url: {{ tpl .Values.observability.tempoUrl . }}/api/mcp
  allowedTools:
    - traceql-search
    - traceql-metrics-instant
    - traceql-metrics-range
    - get-trace
    - get-attribute-names
    - get-attribute-values
    - docs-traceql
  prompt: |
    ## Tempo server notes
    Scope: traces stored in this cluster's Tempo, within its retention. Read-only.
    Use for: the path of one request across services; which span failed or was slow and what it was calling; the database statement, topic or downstream host behind a span; and exceptions recorded on spans. Not for: log lines, container state, or metrics that do not come from spans.
    Can:
    - search traces with TraceQL over a window: traceql-search
    - fetch every span of one trace by its ID: get-trace
    - compute metrics from spans, at one instant or as a series over a window: traceql-metrics-instant, traceql-metrics-range
    - list attribute names for a scope (resource, span, event or intrinsic), and one attribute's values: get-attribute-names, get-attribute-values
    - read TraceQL syntax help: docs-traceql
    Cannot:
    - show spans from services that are not instrumented or do not export traces
    - tell an attribute that does not exist from a value that matched nothing: both return no traces
    - compute TraceQL metrics where Tempo's local-blocks processor is not running: then traceql-metrics-instant and traceql-metrics-range return no series for every query, including { } | rate(), and the span metrics on the metrics server carry request rate, errors and latency per service instead
    Identifiers:
    - resource.service.name is the OpenTelemetry service name: the same value as service_name in span metrics and in OpenTelemetry logs, and usually not the workload name. Its values list the services that send traces.
    - resource.k8s.namespace.name, resource.k8s.deployment.name, resource.k8s.pod.name and resource.k8s.node.name tie a span to Kubernetes objects; resource.service.version and resource.container.image.tag give the running version.
    Attributes:
    - Intrinsics: status (ok, error, unset), statusMessage, kind (server, client, producer, consumer, internal), name, duration, rootServiceName, rootName and traceDuration.
    - HTTP: span.http.route, span.http.response.status_code (span.http.status_code on older instrumentation), span.http.request.method (span.http.method on older instrumentation), span.url.path, span.server.address and span.network.peer.address.
    - Databases: span.db.system, span.db.name, span.db.operation and span.db.sql.table, with the statement in span.db.statement or span.db.query.text.
    - Messaging and RPC: span.messaging.system, span.messaging.destination.name and span.messaging.kafka.partition; span.rpc.service, span.rpc.method and span.rpc.grpc.status_code; span.error.type.
    - Exceptions are span events: event:name = "exception", with event.exception.type, event.exception.message and event.exception.stacktrace.
    Query shapes that work here:
    - failing requests into a service: { resource.service.name = "<otel service name>" && kind = server && status = error }
    - slow requests: { resource.service.name = "<otel service name>" && kind = server && duration > <threshold such as 500ms> }
    - failing calls a service makes: { resource.service.name = "<otel service name>" && kind = client && status = error }; get-trace on one result shows the failing child span, the service it reached and its attributes
    - slow database statements: { resource.service.name = "<otel service name>" && span.db.system = "<database system>" && duration > <threshold> }
    - server errors by status code: { resource.service.name = "<otel service name>" && span.http.response.status_code >= 500 }
    - spans that recorded an exception: { resource.service.name = "<otel service name>" && event:name = "exception" }, with event.exception.message =~ ".*<text>.*" for one message
    - error rate and latency over time, where metrics return series: { resource.service.name = "<otel service name>" && kind = server } | rate() by (status), and the same spanset with | quantile_over_time(duration, .95)
    Limits:
    - traceql-search returns a limited number of traces per call (20 by default). Workaround: narrow the window or add conditions to reach other traces.
    - Metrics queries accept a shorter window than searches, and a longer one fails with an error that states the maximum. Workaround: split the window.
    - The filter-query of get-attribute-values takes one spanset whose conditions are joined with && only.
    - Trace IDs in results can lack leading zeros. Workaround: pass them to get-trace as shown.
    - When start and end are omitted, the window is the past hour. Workaround: pass both.
{{- end }}
