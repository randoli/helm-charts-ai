{{- if and .Values.mcpServers.tempo.enabled .Values.observability.tempoUrl }}
apiVersion: mcp.ai.randoli.io/v1beta1
kind: MCPConfiguration
metadata:
  name: mcp-tempo
  annotations:
    mcp.ai.randoli.io/rca:                "enabled"
    mcp.ai.randoli.io/runbook:            "enabled"
    mcp.ai.randoli.io/periodic-runbook:   "enabled"
    mcp.ai.randoli.io/runbook-validation: "enabled"
    mcp.ai.randoli.io/sre-chat:           "enabled"
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.tempo.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "mcpServerLabels" (dict "context" . "component" "randoli-mcp-kubernetes-readonly") | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.tempo.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  namespace: {{ .Release.Namespace }}
spec:
  type: tempo
  transport: streamable_http
  url: {{ tpl .Values.observability.tempoUrl . }}/api/mcp
  tools:
    traceql-search:          read
    traceql-metrics-instant: read
    traceql-metrics-range:   read
    get-trace:               read
    get-attribute-names:     read
    get-attribute-values:    read
    docs-traceql:            read
  prompt: |
    ## Tempo server notes
    Scope: traces in this cluster's Tempo, within retention. Read-only. Use for one request's path across services, which span failed or was slow, and the statement, topic or host behind it. Not for logs, container state, or metrics that do not come from spans.
    Cannot:
    - show spans from services that do not export traces; traces are sampled, so a missing trace does not show a request did not happen.
    - tell an attribute that does not exist from a value that matched nothing: both return no traces.
    - compute TraceQL metrics where Tempo's local-blocks processor is not running: traceql-metrics-instant and -range then return no series for every query; use the span metrics on the metrics server instead.
    Identifiers: resource.service.name is the OTel service name (same as service_name in span metrics and OTel logs, usually not the workload name); resource.k8s.namespace.name, .deployment.name, .pod.name, .node.name; resource.service.version and resource.container.image.tag.
    Attributes:
    - Intrinsics: status (ok, error, unset), statusMessage, kind (server, client, producer, consumer, internal), name, duration, rootServiceName, rootName, traceDuration.
    - HTTP: span.http.route, span.http.response.status_code (older: span.http.status_code), span.http.request.method (older: span.http.method), span.url.path, span.server.address, span.network.peer.address.
    - Databases: span.db.system, span.db.name, span.db.operation, span.db.sql.table, statement in span.db.statement or span.db.query.text.
    - Messaging and RPC: span.messaging.system, span.messaging.destination.name, span.messaging.kafka.partition; span.rpc.service, span.rpc.method, span.rpc.grpc.status_code; span.error.type.
    - Exceptions are events: event:name = "exception", with event.exception.type, .message, .stacktrace.
    Query shapes that work here:
    - failing requests in: { resource.service.name = "<svc>" && kind = server && status = error }; slow: ... && duration > <threshold>
    - failing calls out: { resource.service.name = "<svc>" && kind = client && status = error }; get-trace on one shows the failing child and what it reached
    - slow statements: { resource.service.name = "<svc>" && span.db.system = "<db>" && duration > <threshold> }
    - 5xx: { resource.service.name = "<svc>" && span.http.response.status_code >= 500 }
    - exceptions: { resource.service.name = "<svc>" && event:name = "exception" }, with event.exception.message =~ ".*<text>.*"
    - rate and latency over time, where metrics work: {...} | rate() by (status), {...} | quantile_over_time(duration, .95)
    Reading traces:
    - A trace shows one request; a claim about a service needs several traces or a metric over spans. Keep the trace ID with every span you cite.
    - In a slow trace, the span whose own duration is most of its parent's, with few children, is where the time went; a slow parent with fast children is time spent in the parent (queueing, locks, waiting for a connection). Compare with a fast trace of the same route.
    - Read a failure at its deepest error span; the spans above it are propagation.
    - A fast database span under a slow client span is time spent getting the connection; a gap between producer and consumer spans is queue time.
    - A caller span ending at a round number just before its error, with the callee still running or absent, is the caller's timeout.
    Limits:
    - traceql-search returns 20 traces by default. Workaround: narrow the window or add conditions.
    - Metrics queries accept a shorter window than searches; the error states the maximum. Workaround: split the window.
    - get-attribute-values takes one spanset joined with && only.
    - Trace IDs can lack leading zeros; pass them to get-trace as shown.
    - start and end default to the past hour. Workaround: pass both.
{{- end }}
