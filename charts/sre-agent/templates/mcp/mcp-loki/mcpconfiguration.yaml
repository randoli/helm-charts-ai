{{- if .Values.mcpServers.loki.enabled }}
apiVersion: mcp.ai.randoli.io/v1beta1
kind: MCPConfiguration
metadata:
  name: mcp-loki
  annotations:
    mcp.ai.randoli.io/rca:                "enabled"
    mcp.ai.randoli.io/runbook:            "enabled"
    mcp.ai.randoli.io/periodic-runbook:   "enabled"
    mcp.ai.randoli.io/runbook-validation: "enabled"
    mcp.ai.randoli.io/sre-chat:           "enabled"
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.loki.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "mcpServerLabels" (dict "context" . "component" "randoli-mcp-server-loki") | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.loki.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: loki
  transport: streamable_http
  url: http://randoli-mcp-server-loki.{{ .Release.Namespace }}.svc:{{ .Values.mcpServers.loki.port }}/stream
  tools:
    loki_query:        read
    loki_label_names:  read
    loki_label_values: read
  prompt: |
    ## Loki server notes
    Scope: log lines in this cluster's Loki, retention about 30 days (a window 29 days back returns lines, 31 days back none), including pods deleted within that time. Read-only. Not for object state, metrics or traces.
    Cannot:
    - run metric queries (count_over_time, rate, sum by): every one fails with "cannot unmarshal number into Go struct field LokiEntry...". Count by reading lines instead.
    - search line content with loki_label_names or loki_label_values; a word needs a line filter on loki_query.
    - tell a missing label, a value that matched nothing and a line filter that matched nothing apart: each returns no lines.
    Identifiers:
    - Every pod's container output: k8s_pod_namespace, k8s_pod_name, k8s_container_name, k8s_container_image, k8s_pod_node_name, service_name, source_type="kubernetes_logs". service_name is the pod's OTel service name, often the container name; pods without one have service_name="<null>".
    - A few services also send OTel log streams labelled k8s_namespace_name, k8s_pod_name, k8s_container_name, k8s_deployment_name, service_name, with trace_id, span_id and severity_text as metadata; most namespaces have no k8s_namespace_name stream.
    - There is no namespace, pod or severity label. detected_level (debug, info, warn, error, unknown) is added per line; unreadable formats get unknown, so a level filter misses their errors.
    - Label regexes are fully anchored: =~"<workload>-.*" for a prefix, =~".*<name>.*" for part of a name.
    - A line's first timestamp is when Loki stored it (UTC); a time inside the message is the application's own and may be in another zone. Order events by the first.
    Keeping results small (busy services write thousands of lines an hour, and every line returned takes room in the conversation):
    - ALWAYS read with a line filter for what you are looking for, limit 50 or less, | line_format "{{`{{ __line__ | trunc 300 }}`}}" after the filters, and format set to text, which prints each stream's labels once. Raise the limit or drop trunc only for the lines you need, over a window of a few seconds around them.
    - A container's whole start-up or crash output can arrive as one entry of many lines, so trunc shows only its opening and hides an error further in. ALWAYS filter for error words before you say a log has none, such as |~ "(?i)error|fail|bad|fatal|panic|exception|refused": a line filter matches anywhere in the entry, before trunc cuts it. Then read a matching entry in full, without trunc, over a few seconds around its timestamp.
    - To learn how often a line occurs, read it with the filter, trunc and text format over a few minutes and count those lines, then scale to the hour; hours of raw lines cost far more and say the same.
    - For an exact count over a window, read every matching line with | line_format "{{`{{ __line__ | trunc 40 }}`}}", format text and limit up to 5000, and count the lines returned: a count needs the lines, not their text, and 40 characters a line keeps thousands of lines small. A read that returns exactly its limit was cut, so split the window.
    Selectors that work here:
    - one pod, also after deletion: {k8s_pod_name="<pod>"}
    - a workload: {k8s_pod_namespace="<namespace>", k8s_pod_name=~"<workload>-.*"}
    - a service by OTel name: {k8s_pod_namespace="<namespace>", service_name="<otel service name>"}
    - one node: {k8s_pod_node_name="<node>"}
    - one trace: {service_name="<otel service name>"} | trace_id="<trace id>", or |= "<trace id>" on container lines
    - errors in any format: |~ "(?i)error|exception|fatal|panic|refused|timeout", or | detected_level=~"error|warn"
    Going deeper:
    - when an error first appeared: halve the time range with the error's filter and limit 1 (a line back means it is in that half), repeat until a few minutes wide, then read around the first match without a filter. About fifteen queries cover 30 days.
    - how often and where: read up to 5000 matching lines and count by k8s_pod_name, k8s_pod_node_name, minute, or a caller id in the message.
    - before a crash: the pod's lines with no filter, in a narrow window ending at the termination time.
    Reading lines:
    - The first occurrence usually names the cause; later lines are consequences. An error already present at the same rate before the onset is background.
    - Read the layer that raised an error: connection refused, reset or timeout to a host and port is the dependency or network; name resolution is DNS or the Service; authentication or authorization is a credential or policy; parse or schema errors are the data or a producer; no space, too many open files or cannot allocate memory is the host or a limit; a stack trace is the application's own path.
    - Lines before the process reports ready are start-up failures; errors only under load are capacity.
    - Before saying an error is absent, run the selector without the line filter: lines back means the stream exists and nothing matched; none means only that the selector found nothing.
    - The earliest line returned marks the window or retention edge, not when the problem began; find the first occurrence, or say "since at least <time>".
    - A line that names a caller (a session, client, user, request or connection id) records who asked for the work. Count the lines by that id before explaining them by the logging workload's own settings, because a fix then belongs with the caller.
    - Reads of separate windows show those windows only. Say an error ran without a break only after reading the time between them; otherwise name the windows where it was seen.
    Limits:
    - Each line comes back with its stream's labels and the whole message, and some services write lines several thousand characters long: 50 raw lines of one service have measured 300,000 characters, and the same 50 with trunc 300 and format text about 16,000. Workaround: read as Keeping results small says.
    - | json adds every field it parses to the labels and makes each line larger. Workaround: use it only to filter on a field, followed by line_format.
    - start and end default to the last hour. Workaround: always pass both.
    - limit defaults to 100, max 5000, and lines come back newest first. A read that returns as many lines as its limit was cut: it holds only the newest end of its window, its earliest line is not when anything began, and a client, session or error that stopped earlier is missing from it, so a count or a list of distinct values from it covers only that end. Workaround: compare the number of lines a read returned with its limit before using its first time, a count or a list; when they are equal, raise limit, add a filter, or split the window and read each part.
    - A broad selector over a long window can time out. Workaround: add k8s_pod_name or k8s_container_name, or split the window.
    - Leave url, username, password, token and org unset; they point at another Loki.
{{- end }}
