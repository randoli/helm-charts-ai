{{- /*
Loki MCP server (Randoli-repackaged grafana/loki-mcp, read-only) exposing Loki
query tools to the SRE agent over streamable HTTP at /stream. The server reads
its listen port from PORT and the Loki base URL from LOKI_URL.
*/ -}}
{{- if .Values.mcpServers.loki.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: randoli-mcp-server-loki
  namespace: {{ .Release.Namespace }}
  labels:
    app: randoli-mcp-server-loki
    {{- include "mcpServerLabels" (dict "context" . "component" "randoli-mcp-server-loki") | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.loki.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.global.annotations .Values.mcpServers.loki.annotations }}
  annotations:
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.loki.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: randoli-mcp-server-loki
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: randoli-mcp-server-loki
        {{- include "mcpServerLabels" (dict "context" . "component" "randoli-mcp-server-loki") | nindent 8 }}
        {{- with .Values.global.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.mcpServers.loki.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.mcpServers.loki.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: mcp-server
        image: {{ .Values.mcpServers.loki.image }}
        imagePullPolicy: {{ .Values.mcpServers.loki.imagePullPolicy }}
        {{- with .Values.mcpServers.loki.extraArgs }}
        args:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        env:
        - name: PORT
          value: {{ .Values.mcpServers.loki.port | quote }}
        - name: LOKI_URL
          value: {{ .Values.mcpServers.loki.lokiUrl | default .Values.observability.lokiUrl | quote }}
        {{- if .Values.mcpServers.loki.orgId }}
        - name: LOKI_ORG_ID
          value: {{ .Values.mcpServers.loki.orgId | quote }}
        {{- end }}
        {{- if .Values.mcpServers.loki.auth.secretName }}
        - name: LOKI_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.mcpServers.loki.auth.secretName }}
              key: {{ .Values.mcpServers.loki.auth.tokenKey }}
        {{- end }}
        {{- with .Values.mcpServers.loki.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.mcpServers.loki.port }}
          protocol: TCP
        {{- with .Values.mcpServers.loki.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- if or .Values.mcpServers.loki.tolerations .Values.global.tolerations }}
      tolerations:
        {{- with .Values.mcpServers.loki.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.global.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if or .Values.mcpServers.loki.nodeSelector .Values.global.nodeSelector }}
      nodeSelector:
        {{- with .Values.mcpServers.loki.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.global.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if or .Values.mcpServers.loki.affinity .Values.global.affinity }}
      affinity:
        {{- with .Values.mcpServers.loki.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.global.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
