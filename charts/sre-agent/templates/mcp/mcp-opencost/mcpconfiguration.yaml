{{- if and .Values.mcpServers.opencost.enabled .Values.dataPlane.opencostUrl }}
apiVersion: mcp.ai.randoli.io/v1beta1
kind: MCPConfiguration
metadata:
  name: mcp-opencost
  annotations:
    mcp.ai.randoli.io/runbook:          "enabled"
    mcp.ai.randoli.io/periodic-runbook: "enabled"
    mcp.ai.randoli.io/sre-chat:         "enabled"
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.opencost.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "mcpServerLabels" (dict "context" . "component" "randoli-mcp-opencost") | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.opencost.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  namespace: {{ .Release.Namespace }}
spec:
  type: opencost
  transport: streamable_http
  url: {{ tpl .Values.dataPlane.opencostUrl . }}
  tools:
    get_allocation_costs: read
    get_asset_costs:      read
    get_cloud_costs:      read
  prompt: |
    ## OpenCost server notes
    Scope: what this cluster and its cloud account cost, from OpenCost: cost allocated to Kubernetes workloads, the cost of the underlying assets, and the cloud provider's bill. Read-only. Use for spend, cost per namespace, pod, node or service, and what drives a bill. Not for usage over time (the metrics server), object state, logs or traces.
    Tools:
    - get_allocation_costs: cost inside the cluster by workload. window (required: "7d", "1h", "30m", "today", "month"); aggregate (namespace, pod, node, controller, service, label:<key>, several joined with commas); step ("1d"); accumulate (sum over the window instead of stepping); share_idle (spread idle cost over allocations); include_idle (idle as its own line).
    - get_asset_costs: the assets behind the cluster: Node (CPU, RAM, GPU), Disk, LoadBalancer, Network, Cloud (with credits), ClusterManagement. window (required).
    - get_cloud_costs: the provider's bill (AWS, GCP, Azure), apart from Kubernetes. window (required); aggregate (provider, service, region); accumulate (day, week, month); provider, service, category, region, accountID; filter (raw expression such as regionID:"us-west-1").
    Which tool: workload, namespace or pod spend is get_allocation_costs; nodes, disks and load balancers are get_asset_costs; the bill by service, region or account is get_cloud_costs. A question across both, such as why a bill rose, reads the cloud cost and the allocation or asset cost and sets them side by side.
    Reading:
    - Settle the window before a call; when the question gives none, use 7d and say so.
    - Group by what the question asks (namespace for which team spends most, service for which cloud service costs most).
    - Report a ranked list or a short table of the top cost drivers with the total and its currency; name outliers and spikes. Say whether idle cost was shared or listed, since that changes what a workload's figure means.
    - A figure comes from a result or it is not given; an empty or failed result is reported as such, with a narrower window or another grouping as the next step.
    - Name a saving only when the data shows it, such as a node far under its CPU and memory next to its cost, an idle disk, or a region with unusual egress.
{{- end }}
