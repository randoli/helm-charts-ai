{{- if and .Values.mcpServers.prometheus.enabled .Values.observability.prometheusUrl }}
apiVersion: mcp.ai.randoli.io/v1beta1
kind: MCPConfiguration
metadata:
  name: mcp-prometheus
  annotations:
    mcp.ai.randoli.io/rca:                "enabled"
    mcp.ai.randoli.io/runbook:            "enabled"
    mcp.ai.randoli.io/periodic-runbook:   "enabled"
    mcp.ai.randoli.io/runbook-validation: "enabled"
    mcp.ai.randoli.io/sre-chat:           "enabled"
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.prometheus.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "mcpServerLabels" (dict "context" . "component" "randoli-mcp-server-prometheus") | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.prometheus.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  namespace: {{ .Release.Namespace }}
spec:
  type: prometheus
  transport: streamable_http
  url: http://randoli-mcp-server-prometheus.{{ .Release.Namespace }}.svc:{{ .Values.mcpServers.prometheus.port }}/mcp
  tools:
    query:           read
    range_query:     read
    label_names:     read
    label_values:    read
    series:          read
    metric_metadata: read
  prompt: |
    ## Prometheus server notes
    Scope: metrics this cluster's Prometheus scrapes, within its retention. Read-only. Use for how values changed over time, including pods and nodes that are gone. Not for log lines, traces or an object's current spec.
    Cannot: show why a scrape failed (up only says whether it succeeded); show data outside retention or from unscraped targets; tell a missing metric, a missing label and a value that matched nothing apart (each is empty).
    Identifiers (one service carries different names in different series, so read one series' labels with series before filtering):
    - Kubernetes state and container series: namespace, pod, container, node; a workload is pod=~"<workload>-.*". On kube_pod_* series other than kube_pod_info, node or instance can name the kube-state-metrics pod's node; read a pod's node from kube_pod_info and match one pod across series by uid. cAdvisor container series carry the node in instance.
    - OpenTelemetry series (span metrics, OTel HTTP, db-pool, JVM): service_name = OTel service name, job = "<namespace>/<otel service name>" or "<otel service name>", plus k8s_namespace_name, k8s_deployment_name, k8s_pod_name.
    - Micrometer series from Java services (http_server_requests_seconds_*, http_client_requests_seconds_*, hikaricp_*, jdbc_*, lettuce_*, jvm_*): service_name, job, app and service = the scraped Service's name (the workload name in some namespaces, the OTel name in others), plus k8s_namespace_name, k8s_pod_name, pod.
    - A service can appear under both schemes and some send no span metrics: list service_name values on the metric before concluding a service has no data.
    Series by question:
    - Pods: kube_pod_info (node, created_by_kind, created_by_name), kube_pod_created, kube_pod_start_time, kube_pod_deletion_timestamp, kube_pod_status_phase, _ready, _reason; names of gone pods and nodes stay.
    - Restarts: kube_pod_container_status_restarts_total, kube_pod_container_status_last_terminated_reason, _exitcode, _timestamp, kube_pod_container_status_waiting_reason, kube_pod_container_state_started.
    - Nodes: kube_node_created, kube_node_status_condition (also provider conditions such as scheduled VM events and preemption), kube_node_spec_unschedulable, kube_node_spec_taint, kube_node_labels (spot pools in label_*); node_memory_MemAvailable_bytes, node_filesystem_avail_bytes, node_disk_io_time_seconds_total.
    - Controllers and volumes: kube_deployment_status_replicas_unavailable, kube_statefulset_status_replicas_ready, kube_daemonset_status_number_unavailable, kube_job_status_failed, kube_cronjob_status_last_successful_time, kube_cronjob_status_last_schedule_time, kube_persistentvolumeclaim_status_phase, kubelet_volume_stats_used_bytes and _capacity_bytes.
    - Container resources (container!="" excludes pod totals): container_memory_working_set_bytes, container_oom_events_total, container_cpu_usage_seconds_total (rate = cores used), container_cpu_cfs_throttled_periods_total / container_cpu_cfs_periods_total (throttled share, only with a CPU limit), container_fs_usage_bytes, container_network_receive_errors_total; requests and limits in kube_pod_container_resource_requests and _limits (resource="cpu" or "memory"). container_cpu_allocation is OpenCost's cost figure, not usage.
    - Requests into a service: randoli_metrics_otel_span_metrics_calls_total and _duration_milliseconds_bucket/_count/_sum (span_kind="SPAN_KIND_SERVER", span_name, status_code STATUS_CODE_OK|STATUS_CODE_ERROR|STATUS_CODE_UNSET, http_status_code); http_server_request_duration_seconds_*; http_server_requests_seconds_count/_sum/_max (uri, status, outcome, exception).
    - Calls out: span metrics with span_kind="SPAN_KIND_CLIENT" or "SPAN_KIND_PRODUCER" (server_address, messaging_system); http_client_request_duration_seconds_*; http_client_requests_seconds_* (client_name = target host).
    - Edge: nginx_ingress_controller_requests_total and _request_duration_seconds_* (exported_namespace, exported_service, ingress, status); kong_http_requests_total (exported_service = <namespace>.<service>.<port>, route, code), kong_upstream_latency_ms_*, kong_upstream_target_health.
    - DB pools in the caller: hikaricp_connections_active/_idle/_pending/_max/_timeout_total/_acquire_seconds_*; db_client_connections_usage/_max/_pending_requests/_wait_time_milliseconds_*/_timeouts_total; jdbc_connections_active/_max; spring_data_repository_invocations_seconds_*; Go: db_sql_client_latency_milliseconds_*, db_sql_client_calls_total (db_sql_error has the error text).
    - PostgreSQL servers: postgresql_backends vs postgresql_connection_max, postgresql_deadlocks_total, _rollbacks_total, _database_locks, _replication_data_delay_bytes, _wal_age_seconds; per statement db_postgresql_query_mean_exec_time_seconds, _calls_total, _exec_time_seconds_total (query); db_postgresql_blocked_sessions_total, _long_running_queries_seconds.
    - Redis from Java: lettuce_command_completion_seconds_*, lettuce_command_firstresponse_seconds_* (command, remote).
    - Kafka: kafka_brokers, kafka_partition_under_replicated, kafka_partition_offline, kafka_controller_active_count, kafka_request_failed_total, kafka_topic_partitions, kafka_producer_record_error_total; consumer lag only from Java clients (kafka_consumer_fetch_manager_records_lag_max, _records_lag, kafka_consumer_group_lag_ratio). Other clients export no lag, so a consumer missing here has no lag reading, not no lag.
    - NATS: nats_varz_connections, _slow_consumers, _in_msgs, _out_msgs; nats_consumer_num_pending, _num_ack_pending, _num_redelivered.
    - JVM (Java only): jvm_memory_used_bytes (area), jvm_gc_pause_seconds_*, jvm_gc_overhead, jvm_threads_states_threads, executor_active_threads, executor_queued_tasks.
    - Platform: certmanager_certificate_expiration_timestamp_seconds, certmanager_certificate_ready_status, externalsecret_status_condition, externalsecret_sync_calls_error_total, up, vector_component_errors_total, otelcol_receiver_refused_spans_total, otelcol_exporter_send_failed_metric_points_total.
    Query shapes that work here:
    - p95 into a service: histogram_quantile(0.95, sum by (le) (rate(randoli_metrics_otel_span_metrics_duration_milliseconds_bucket{service_name="<svc>", span_kind="SPAN_KIND_SERVER"}[5m]))); per dependency: sum by (le, server_address) with span_kind="SPAN_KIND_CLIENT".
    - error ratio: sum(rate(randoli_metrics_otel_span_metrics_calls_total{service_name="<svc>", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m])) / the same without status_code.
    - memory against limit per pod: max by (pod) (container_memory_working_set_bytes{namespace="<ns>", pod=~"<workload>-.*", container!=""}) / max by (pod) (kube_pod_container_resource_limits{namespace="<ns>", pod=~"<workload>-.*", resource="memory"})
    - every restart, not just the last: range_query kube_pod_container_status_restarts_total{namespace="<ns>", pod=~"<workload>-.*"} at the scrape interval; each step up is the minute of one restart.
    - first failed run of a CronJob in retention: range_query max by (job_name) (kube_job_status_failed{namespace="<ns>", job_name=~"<cronjob>-.*"}); Job series stay after the Job is deleted.
    - where pods ran over time: kube_pod_info over a range from well before the incident; a new pod or node marks a reschedule.
    - counters: wrap _total and _count in rate() or increase().
    Reading: take the series whose onset is earliest as the candidate origin, and read each pod's series on its own, since one bad replica averages away. A value that never moves is usually stale: check up first.
    Limits:
    - A broad selector can exceed truncation_limit. Workaround: add label filters, sum by, or topk().
    - A range_query point is the value at that instant; a wide step or rate window hides short spikes. Workaround: peaks with max_over_time at the scrape interval (1m by default): max_over_time(<gauge>[<window>]), or max_over_time(rate(<counter>[2m])[<window>:1m]).
    - Times, durations and growth read off points are only as exact as the step, and the first point may be the window or retention edge. Workaround: use the timestamp series above or a narrow window at the scrape interval; at an edge say "since at least <time>".
    - kube-state-metrics keeps only each container's last termination. Workaround: earlier restarts from the steps in kube_pod_container_status_restarts_total.
    - OOMKilled with a sampled working set well below the limit means a spike between samples or memory the working set does not count; the peak at the kill is not established (the node's kernel log could show it).
    - An instant query sees only series that reported in the last few minutes. Workaround: range_query over the time the target existed.
    - Times print as Unix seconds with UTC beside them (<value> @[<unix> = <UTC>], or <value> (= <UTC>) for timestamp values). Read times from the UTC text and use the time conversion tool for any other conversion or difference.
{{- end }}
