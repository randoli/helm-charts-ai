{{- if and .Values.mcpServers.kubernetes.enabled (not .Values.global.openshift.enabled) }}
apiVersion: mcp.ai.randoli.io/v1beta1
kind: MCPConfiguration
metadata:
  name: randoli-mcp-kubernetes
  annotations:
    mcp.ai.randoli.io/runbook:          "enabled"
    mcp.ai.randoli.io/periodic-runbook: "enabled"
    mcp.ai.randoli.io/sre-chat:         "enabled"
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.kubernetes.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "mcpServerLabels" (dict "context" . "component" "randoli-mcp-server-kubernetes") | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.kubernetes.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  namespace: {{ .Release.Namespace }}
spec:
  type: kubernetes
  transport: streamable_http
  url: http://randoli-mcp-server-kubernetes.{{ .Release.Namespace }}.svc:{{ .Values.mcpServers.kubernetes.port }}/mcp
  tools:
    pods_list:               read
    pods_list_in_namespace:  read
    pods_get:                read
    pods_log:                read
    pods_top:                read
    resources_get:           read
    resources_list:          read
    events_list:             read
    namespaces_list:         read
    nodes_top:               read
    nodes_stats_summary:     read
    nodes_log:               read
    helm_list:               read
    pods_delete:             mutate
    resources_scale:         mutate
  prompt: |
    ## Kubernetes server notes
    Scope: the live state of this cluster through the Kubernetes API (every resource kind including custom resources, recent events, container logs, current CPU and memory), and two changes: deleting a pod and scaling a workload. Not for history older than objects and recent events keep, log search over a window, metrics over time or traces.
    Changes and what they really do:
    - pods_delete deletes one pod; its controller replaces it at once under a new name. It is not a rollout restart: deleting a workload's only pod, or all of them, leaves it with no ready pod until replacements start.
    - resources_scale sets a Deployment's or StatefulSet's replica count. Scaling to zero and back is not a restart either: it removes every replica at once.
    - A change stays until something changes it again. A resource an operator, Helm release or GitOps app manages can be set back by that manager (see its ownerReferences, app.kubernetes.io/managed-by label and GitOps annotations); a lasting change goes through the manager.
    - After a change, read the resource or its pods again rather than trusting the change call's output. A change call that timed out may still have applied: read first, retry only if it did not.
    Cannot:
    - exec into a container, create any resource, rollout restart or roll back, change anything but replica count, delete anything but a pod, cordon or drain a node, or install, upgrade, roll back or uninstall a Helm release.
    - show a Helm release's values or rendered manifests, or charts a GitOps tool rendered itself (an Argo CD Application with a Helm source leaves no Helm release; read the Application's status).
    - show Secret values: each is replaced by a placeholder, so a hidden value is not a missing or empty one.
    - show who changed a field or when: resources_get and resources_list return objects without metadata.managedFields.
    - show events older than a few hours, deleted pods or removed nodes (their names stay in metric and log history), or Jobs a CronJob already deleted (it keeps only its last few; status.lastSuccessfulTime and the job series in Prometheus reach further back).
    - show usage over time; read the log of a container that has not started; join resources for you; tell a missing namespace from a selector that matched nothing (both are empty).
    - read a node's own log files (kernel log, syslog, the kubelet's log) unless the kubelet has node log query turned on: otherwise nodes_log returns, for any query, the list of files under the node's /var/log, not their contents. A reply that is that list means nothing was read. The kernel's OOM-kill lines (`Memory cgroup out of memory: Killed process <pid> (<name>) ... anon-rss:<kB>`), which give the memory a killed process held and which limit killed it, are then out of reach: name them as the read that would settle a kill's peak, and say no connected tool reads them. A container's last termination reason OOMKilled is the kubelet's own record of that kernel kill and stands as its evidence.
    Identifiers:
    - Pod names: Deployment <workload>-<replicaset hash>-<suffix>, StatefulSet <workload>-<ordinal>, Job <job>-<suffix>. A name changes each time the pod is replaced, so read current names before a change that names a pod.
    - A pod's OTel service name is its resource.opentelemetry.io/service.name annotation; it keys request metrics, traces and service logs and often differs from the workload name.
    - Repository and commit: annotations ai.randoli.io/git-repo (github.com/<owner>/<repository>) and ai.randoli.io/git-revision. Read them on the pod first (most precise), then its Service, then its Deployment or StatefulSet, and stop at the first pair; only pod-template annotations reach pods. With no pair, which is normal here, give the image and tag from spec.containers[].image and leave finding the repository to the repository server.
    - spec.nodeName names a pod's node; pods on a node: pods_list with field selector spec.nodeName=<node>. Nodes are cluster-scoped: resources_get kind Node with the name alone.
    - metadata.ownerReferences leads pod → ReplicaSet/StatefulSet/DaemonSet/Job → Deployment; ReplicaSets carry deployment.kubernetes.io/revision, ControllerRevisions a revision number.
    Environment:
    - Field selectors: most kinds accept only metadata.name and metadata.namespace; pods also status.phase and spec.nodeName; events involvedObject.kind, involvedObject.name, reason and type.
    - Custom resources hold operator and GitOps state where installed: argoproj.io Application (sync, health, deploy history), kafka.strimzi.io, external-secrets.io, cert-manager.io, postgres-operator.crunchydata.com, velero.io. List CustomResourceDefinitions (apiextensions.k8s.io/v1) to see which exist; "no matches for kind" means not installed or that version not served.
    - Spot nodes (kubernetes.azure.com/scalesetpriority=spot, cloud.google.com/gke-spot=true) are replaced often and their pods restart elsewhere.
    - A Node holds status.conditions (Ready; MemoryPressure, DiskPressure, PIDPressure), capacity and allocatable (what pods are scheduled against), spec.taints and spec.unschedulable, status.nodeInfo, and pool, instance-type and zone labels. nodes_top gives current CPU and memory; nodes_stats_summary adds filesystem use, per-pod working set and network counters. Node events: events_list with involvedObject.kind=Node, cluster-wide.
    Going deeper:
    - whether the whole application is down or only one part of it: the other workloads that share its app.kubernetes.io/instance label or its name prefix in the namespace, such as a database's data members beside its arbiter or a broker beside its controller, with resources_list for StatefulSets and Deployments and their replicas, because the part reported failing may not be the part that stops users
    - why a pod is new: its creationTimestamp and spec.nodeName against the node's creationTimestamp, the owner's revisions, and eviction or preemption events while they last.
    - what a crashed container printed: pods_log with previous set and a small tail.
    - what changed in a rollout: the pod template of the current ReplicaSet or ControllerRevision against the previous one.
    - why a pod was evicted, killed or will not schedule: its node's conditions, allocatable and taints, then nodes_top, and nodes_stats_summary for disk or per-pod memory.
    - which chart a workload came from: meta.helm.sh/release-name and release-namespace annotations, then helm_list in that namespace.
    Limits:
    - resources_list and pods_list with no namespace, labelSelector or fieldSelector return every object of that kind in the cluster: all Deployments, all ConfigMaps or all pods have measured 110,000 to 210,000 characters, which arrives as a saved file instead of in the conversation. Workaround: pass namespace with a labelSelector taken from the workload's own spec.selector.matchLabels, or a fieldSelector such as metadata.name=<name>, and read one object with resources_get.
    - The LABELS column of a node or pod line holds dozens of labels, and a value inside it is easy to misread. Workaround: to find which objects carry a label or a label value, list them with labelSelector (<key>=<value>, or <key> alone for objects that have the label), with one selector per value when comparing values; read one object's labels with resources_get.
    - resources_list for kind Event returns every event of the namespace with its full object, over 100,000 characters in a busy namespace. Workaround: events_list with namespace and the fieldSelector involvedObject.name=<name>.
    - A long log comes back saved to a file with a preview. Workaround: a smaller tail, or a line filter on the log server.
    - nodes_stats_summary, nodes_log and nodes_top can be refused or time out when the kubelet is unreachable or the platform closes that route; that is the read failing, not the node being healthy. nodes_log answering with a list of file names is the same: the file was not read.
    - helm_list shows only each release's latest revision, and only when deployed or failed. Workaround: resources_list kind Secret with label selector owner=helm,name=<release> lists every revision with its status.
    - A call the service account does not allow fails with forbidden; the permissions section below lists what it allows.
{{- end }}
