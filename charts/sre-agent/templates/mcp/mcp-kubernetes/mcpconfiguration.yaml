{{- if and .Values.mcpServers.kubernetes.enabled (not .Values.global.openshift.enabled) }}
apiVersion: mcp.ai.randoli.io/v1beta1
kind: MCPConfiguration
metadata:
  name: randoli-mcp-kubernetes
  annotations:
    mcp.ai.randoli.io/runbook:          "enabled"
    mcp.ai.randoli.io/periodic-runbook: "enabled"
    mcp.ai.randoli.io/sre-chat:         "enabled"
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.kubernetes.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "mcpServerLabels" (dict "context" . "component" "randoli-mcp-server-kubernetes") | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.mcpServers.kubernetes.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  namespace: {{ .Release.Namespace }}
spec:
  type: kubernetes
  transport: streamable_http
  url: http://randoli-mcp-server-kubernetes.{{ .Release.Namespace }}.svc:{{ .Values.mcpServers.kubernetes.port }}/mcp
  tools:
    pods_list:               read
    pods_list_in_namespace:  read
    pods_get:                read
    pods_log:                read
    pods_top:                read
    resources_get:           read
    resources_list:          read
    events_list:             read
    namespaces_list:         read
    nodes_top:               read
    nodes_stats_summary:     read
    nodes_log:               read
    helm_list:               read
    pods_delete:             mutate
    resources_scale:         mutate
  prompt: |
    ## Kubernetes server notes
    Scope: this cluster's live state through the Kubernetes API (every resource kind, custom resources included; recent events; container logs; current CPU and memory) and two changes: deleting a pod and scaling a workload. Not for history beyond what objects and recent events keep, log search over a window, metrics over time or traces.
    Changes:
    - pods_delete removes one pod; its controller replaces it under a new name. Deleting a workload's only pod leaves it with no ready pod until the replacement starts. It is not a rollout restart.
    - resources_scale sets a Deployment's or StatefulSet's replicas. Scaling to zero and back removes every replica at once; it is not a restart either.
    - A manager (operator, Helm release or GitOps app: ownerReferences, app.kubernetes.io/managed-by, GitOps annotations) can set a change back; a lasting change goes through the manager.
    - After a change, read the resource or its pods again instead of trusting the call's output. A call that timed out may have applied: read first, retry only if it did not.
    Cannot:
    - exec, create any resource, rollout restart or roll back, change anything but replicas, delete anything but a pod, cordon or drain, or install, upgrade, roll back or uninstall a Helm release.
    - show a Helm release's values or rendered manifests, or charts a GitOps tool rendered itself (an Argo CD Application with a Helm source leaves no Helm release; read the Application's status).
    - show Secret values: each is a placeholder, so a hidden value is not a missing one.
    - show who changed a field or when (objects come without managedFields); events older than a few hours; deleted pods or removed nodes (their names stay in metric and log history); Jobs a CronJob already deleted (status.lastSuccessfulTime and the job series in Prometheus reach further back).
    - show usage over time; read the log of a container that never started; tell a missing namespace from a selector that matched nothing (both are empty).
    - read node log files (kernel log, syslog, kubelet log) unless the kubelet has node log query on: otherwise nodes_log returns the list of files under /var/log for any query, and that list means nothing was read. The kernel's OOM-kill lines (`Memory cgroup out of memory: Killed process <pid> (<name>) ... anon-rss:<kB>`) are then out of reach: name them as the read that would settle a kill's peak and say no connected tool reads them. A container's last termination reason OOMKilled is the kubelet's own record of that kill and stands as evidence.
    Identifiers:
    - Pod names: Deployment <workload>-<replicaset hash>-<suffix>, StatefulSet <workload>-<ordinal>, Job <job>-<suffix>; a name changes when the pod is replaced.
    - OTel service name: the pod's resource.opentelemetry.io/service.name annotation; it keys request metrics, traces and service logs and often differs from the workload name.
    - Repository and commit: annotations ai.randoli.io/git-repo (github.com/<owner>/<repository>) and ai.randoli.io/git-revision, read on the pod, then its Service, then its Deployment or StatefulSet, stopping at the first pair (only pod-template annotations reach pods). With no pair, which is normal, give spec.containers[].image and leave the repository to the repository server.
    - spec.nodeName names a pod's node; pods on a node: pods_list with fieldSelector spec.nodeName=<node>. Nodes are cluster-scoped: resources_get kind Node by name.
    - ownerReferences lead pod → ReplicaSet/StatefulSet/DaemonSet/Job → Deployment; ReplicaSets carry deployment.kubernetes.io/revision, ControllerRevisions a revision number.
    Environment:
    - Field selectors: most kinds take only metadata.name and metadata.namespace; pods also status.phase and spec.nodeName; events involvedObject.kind, involvedObject.name, reason and type.
    - Operator and GitOps state lives in custom resources where installed: argoproj.io Application (sync, health, deploy history), kafka.strimzi.io, external-secrets.io, cert-manager.io, postgres-operator.crunchydata.com, velero.io. List CustomResourceDefinitions to see which exist; "no matches for kind" means not installed or that version not served.
    - Spot nodes (kubernetes.azure.com/scalesetpriority=spot, cloud.google.com/gke-spot=true) are replaced often and their pods restart elsewhere.
    - A Node holds status.conditions (Ready, MemoryPressure, DiskPressure, PIDPressure), capacity and allocatable, spec.taints, spec.unschedulable, status.nodeInfo and pool, instance-type and zone labels. nodes_top gives current CPU and memory; nodes_stats_summary adds filesystem use, per-pod working set and network counters. Node events: events_list with involvedObject.kind=Node, cluster-wide.
    Going deeper:
    - whether the whole application is down or one part: the workloads sharing its app.kubernetes.io/instance label or name prefix (a database's data members beside its arbiter, a broker beside its controller), with resources_list for StatefulSets and Deployments and their replicas.
    - why a pod is new: its creationTimestamp and spec.nodeName against the node's creationTimestamp, the owner's revisions, and eviction or preemption events while they last.
    - what a crashed container printed: pods_log with previous set and a small tail.
    - what a rollout changed: the current ReplicaSet's or ControllerRevision's pod template against the previous one.
    - why a pod was evicted, killed or will not schedule: its node's conditions, allocatable and taints, then nodes_top and nodes_stats_summary.
    - which chart a workload came from: meta.helm.sh/release-name and release-namespace annotations, then helm_list in that namespace.
    Limits:
    - resources_list and pods_list with no namespace, labelSelector or fieldSelector return every object of that kind (110,000 to 210,000 characters measured), which arrives as a saved file. Workaround: namespace plus a labelSelector from the workload's spec.selector.matchLabels, or fieldSelector metadata.name=<name>, and resources_get for one object.
    - A LABELS column holds dozens of labels and a value in it is easy to misread. Workaround: list with labelSelector <key>=<value>, one selector per value when comparing, and read one object's labels with resources_get.
    - resources_list kind Event returns every event with its full object, over 100,000 characters in a busy namespace. Workaround: events_list with namespace and fieldSelector involvedObject.name=<name>.
    - A long log arrives saved to a file with a preview. Workaround: a smaller tail, or a line filter on the log server.
    - nodes_stats_summary, nodes_log and nodes_top can be refused or time out when the kubelet is unreachable or the platform closes that route: that is the read failing, not the node being healthy.
    - helm_list shows each release's latest revision only, and only when deployed or failed. Workaround: resources_list kind Secret with labelSelector owner=helm,name=<release> lists every revision with its status.
    - A call the service account does not allow fails with forbidden; the permissions section below lists what it allows.
{{- end }}
