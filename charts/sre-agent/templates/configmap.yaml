apiVersion: v1
kind: ConfigMap
metadata:
  name: randoli-sre-agent-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "selectorLabels" . | nindent 4 }}
    {{- include "labels" . | nindent 4 }}
data:
  AGENT_CALLBACK_URL: '{{ tpl (.Values.dataPlane.agentCallbackUrl | toString) . }}'
  DAILY_USAGE_BUDGET_IN_USD: '{{ .Values.analysis.dailyBudgetUsd }}'
  ENABLED_NAMESPACES: '{{ .Values.analysis.enabledNamespaces }}'
  LOG_LEVEL: '{{ .Values.logLevel }}'
  ENABLED_WORKLOADS: '{{ .Values.analysis.enabledWorkloads }}'
  FLIGHTSQL_URL: '{{ tpl .Values.dataPlane.flightSqlUrl . }}'
  LLM_PROVIDER: '{{ .Values.llm.provider }}'
  LOG_LOKI_URL: '{{ tpl .Values.observability.lokiUrl . }}'
  LOG_PROVIDER : loki
  MCP_MAX_ITERATIONS : '{{ .Values.analysis.maxIterationsMCP }}'
  OTEL_EXPORTER_OTLP_ENDPOINT:  '{{ tpl .Values.observability.otelExporterEndpoint . }}'
  OTEL_EXPORTER_OTLP_PROTOCOL : grpc
  OTEL_DISABLED: '{{ .Values.observability.otelDisabled }}'
  OTEL_SERVICE_NAME: randoli-sre-agent
  OTEL_SPAN_ATTRIBUTE_COUNT_LIMIT : '1000'
  OTEL_SPAN_ATTRIBUTE_VALUE_LENGTH_LIMIT : '100000'
  OTEL_SPAN_EVENT_COUNT_LIMIT : '256'
  PROMETHEUS_URL: '{{ tpl .Values.observability.prometheusUrl . }}'
  RCA_INVESTIGATOR_MAX_ITERATIONS : '{{ .Values.analysis.maxIterationsRCA }}'
  # config.py reads AWS_REGION, not REGION. The secret can also carry AWS_REGION;
  # whichever the secret sets wins, since envFrom applies the secret after this map.
  AWS_REGION: '{{ .Values.llm.region }}'
  RUNNING_IN_KUBERNETES: 'true'
  TRACELOOP_BASE_URL: '{{ tpl .Values.observability.traceLoopBaseUrl . }}'
  TRACELOOP_TRACE_CONTENT: 'false'
  TEMPO_URL: '{{ tpl .Values.observability.tempoUrl . }}'
  TRACE_PROVIDER : tempo

  BUDGET_RECONCILE_EVERY_S: '{{ .Values.analysis.budgetReconcileEverySeconds }}'
  BUDGET_READ_TIMEOUT_S: '{{ .Values.analysis.budgetReadTimeoutSeconds }}'

  # Iteration caps per agent.
  RUNBOOK_MAX_ITERATIONS: '{{ .Values.analysis.maxIterationsRunbook }}'
  SRE_CHAT_MAX_ITERATIONS: '{{ .Values.sreChat.maxIterations }}'
  SRE_CHAT_MAX_TOOLS_PER_STEP: '{{ .Values.sreChat.maxToolsPerStep }}'
  SRE_CHAT_MAX_CLARIFICATION_ROUNDS: '{{ .Values.sreChat.maxClarificationRounds }}'
  SRE_CHAT_HISTORY_COUNT: '{{ .Values.sreChat.historyCount }}'

  # Model per role. Every agent resolves its models through these keys (model_provider/registry.py),
  # so the heavy reasoning steps and the cheap background ones can use different models. Each id must
  # also appear in the models.yaml pricing file mounted by this chart.
  {{- range $role, $model := .Values.models }}
  {{ $role }}: '{{ $model }}'
  {{- end }}