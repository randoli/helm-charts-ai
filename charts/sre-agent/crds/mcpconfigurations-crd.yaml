apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpconfigurations.mcp.ai.randoli.io
spec:
  group: mcp.ai.randoli.io
  scope: Cluster
  names:
    kind: MCPConfiguration
    plural: mcpconfigurations
    singular: mcpconfiguration
    shortNames: [mcpconf]
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                type:
                  type: string
                category:
                  type: string
                transport:
                  type: string
                  enum: [streamable_http, sse, stdio]
                url:
                  type: string
                  format: uri
                prompt:
                  type: string
                headers:
                  type: object
                  additionalProperties:
                    type: string
                allowedTools:
                  type: array
                  items:
                    type: string
              required: [type, transport, url, prompt]
          required: [spec]
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Category
          type: string
          jsonPath: .spec.category
        - name: Transport
          type: string
          jsonPath: .spec.transport
