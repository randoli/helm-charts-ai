
name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    # contents: write is needed to create GitHub Releases in this repo.
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # The public chart index lives on the gh-pages branch of randoli/helm-charts
      # (served as helm.randoli.io). chart-releaser merges this repo's releases into
      # that shared index.yaml — it only ever appends entries, so the randoli-agent
      # entries managed by the other repo are preserved.
      # HELM_CHARTS_PAGES_TOKEN: fine-grained PAT with Contents read/write on
      # randoli/helm-charts only.
      - name: Add shared pages remote (randoli/helm-charts)
        env:
          PAGES_TOKEN: ${{ secrets.HELM_CHARTS_PAGES_TOKEN }}
        run: |
          git remote add pages "https://x-access-token:${PAGES_TOKEN}@github.com/randoli/helm-charts.git"
          git fetch pages gh-pages

      - name: Run chart-releaser
        # Same pin as randoli/helm-charts (one commit past v1.7.0, pending a v1.7.1
        # tag; contains the fix for helm/chart-releaser-action#171).
        uses: helm/chart-releaser-action@3e001cb8c68933439c7e721650f20a07a1a5c61e # v1.7.0+1
        env:
          # Releases (tags + .tgz assets) are created in THIS repo.
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_SKIP_EXISTING: true
          # The index update is pushed to the 'pages' remote = randoli/helm-charts gh-pages.
          CR_REMOTE: pages
